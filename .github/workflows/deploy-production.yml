name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Queue deploys instead of cancelling an SSH session halfway through a container
# replacement. Each run deploys the immutable SHA that triggered that run.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install, test, and build the exact commit
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure SSH without logging credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload the reviewed deployment script
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_SSH_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
        run: |
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes scripts/deploy-production.sh \
            "$SSH_USER@$SSH_HOST:/tmp/p91-deploy-${{ github.sha }}.sh"

      - name: Deploy the exact triggering SHA
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_SSH_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "chmod 700 /tmp/p91-deploy-${{ github.sha }}.sh && sudo /tmp/p91-deploy-${{ github.sha }}.sh ${{ github.sha }}; status=\$?; rm -f /tmp/p91-deploy-${{ github.sha }}.sh; exit \$status"
