# Builds the new site's image (apps/web, Next.js standalone) in GitHub Actions and publishes it to
# GHCR, mirroring build-image.yml (the API image). Plan 3 Task 5.
#
# This workflow only builds and pushes. It does not deploy and never touches the server: until
# auto-deploy covers the web image (Plan 3b), the owner runs scripts/deploy-web.sh on the host.
#
# Image:   ghcr.io/<owner>/<repo>-web:<full commit SHA>   immutable, the one deploys and rollbacks use
#          ghcr.io/<owner>/<repo>-web:main                moves with every build; convenience only
#          (for this repository: ghcr.io/hpalrecha/carcarebooker-web)
# Labels:  org.opencontainers.image.revision = the commit SHA, .source = the repository.
#
# Credentials: none to add. Publishing uses the workflow's own short-lived GITHUB_TOKEN with
# `packages: write`.
name: build-web-image

on:
  push:
    branches: [main]
    # Only what the web image is built from.
    paths:
      - "apps/web/**"
      - "packages/content/**"
      - "packages/domain/**"
      - "package-lock.json"
      - ".github/workflows/build-web-image.yml"
  workflow_dispatch:

concurrency:
  group: build-web-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the (lower-case) image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repo root: the lockfile, packages/content and packages/domain are outside apps/web.
          context: .
          file: ./apps/web/Dockerfile
          # The Lightsail host is x86_64.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=carcarebooker-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          # A plain single-platform image (no attestation manifest), so `docker pull` on the host
          # gets exactly one image whose labels it can check.
          provenance: false
          sbom: false
