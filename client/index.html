<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 was removed: it blocked pinch-to-zoom on phones, which is a
         WCAG 1.4.4 failure and a Lighthouse accessibility penalty. Nothing in the layout
         depends on zoom being disabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default document title and description. Routes override these via
         usePageTitle/useSeoMeta. Without this the document had no <title> at all, so the
         browser tab and any shared link fell back to the bare URL. -->
    <title>P91 Car Care — Professional Car Detailing in Bangalore</title>
    <meta
      name="description"
      content="Professional car detailing in Bangalore: ceramic coating, paint protection film, interior and exterior detailing, glass coating and headlight restoration. Book online in 60 seconds."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo (headings) and IBM Plex Sans (body) are the approved redesign typefaces. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />

    <link rel="icon" href="/Car Care (4)_1753951564515.png" />
    <link rel="apple-touch-icon" href="/Car Care (4)_1753951564515.png" />

    <!-- Baseline Open Graph / Twitter tags.
         useSeoMeta overwrites og:title, og:description, og:image and og:url per route; these
         are the fallback every route inherits, and the only thing a crawler sees on a route
         that does not call the hook. Without them a link pasted into WhatsApp — the channel
         this business actually runs on — rendered as a bare URL with no preview card. -->
    <meta property="og:site_name" content="P91 Car Care" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="P91 Car Care — Professional Car Detailing in Bangalore" />
    <meta
      property="og:description"
      content="Ceramic coating, paint protection film, interior and exterior detailing in Bangalore. Book online in 60 seconds."
    />
    <meta property="og:image" content="/Car Care (4)_1753951564515.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="P91 Car Care — Professional Car Detailing in Bangalore" />
    <meta
      name="twitter:description"
      content="Ceramic coating, paint protection film, interior and exterior detailing in Bangalore. Book online in 60 seconds."
    />
    <meta name="twitter:image" content="/Car Care (4)_1753951564515.png" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11467752288"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-11467752288');
    </script>

    <!-- Microsoft Clarity — session counts, heatmaps and recordings.
         Project ID yezkqr1rwm (from the add-clarity-tracking branch, commit 5bf7733).

         This is the official Clarity snippet, unmodified apart from the admin guard
         below. It sits alongside the Google Ads tag above and the GA4 property that tag
         loads (G-QXEEJ4EK4J) — three independent tags, none of which touches the others.
         Clarity tracks client-side navigation itself, so one tag covers every SPA route.

         ADMIN GUARD: the snippet is not injected at all when the first page load is under
         /admin. Admin screens show real customer names, phone numbers, email addresses and
         booking records, and none of that belongs in a session recording. src/lib/clarity.ts
         handles the other direction — navigating INTO /admin after the app has booted.

         Traffic is only separable by campaign if ad destination URLs carry utm_*
         parameters: Instagram and Facebook in-app browsers routinely strip the referrer,
         so paid social otherwise lands in Clarity as "Direct". -->
    <script type="text/javascript">
      (function () {
        if (location.pathname.indexOf('/admin') === 0) return;
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "yezkqr1rwm");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The Replit dev-banner script was removed. It is a development-only helper, the
         app no longer runs on Replit, and it made a third-party request to replit.com on
         every production page load (blocked by ORB, so it only ever cost a round trip). -->
  </body>
</html>
