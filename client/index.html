<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 was removed: it blocked pinch-to-zoom on phones, which is a
         WCAG 1.4.4 failure and a Lighthouse accessibility penalty. Nothing in the layout
         depends on zoom being disabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default document title and description. Routes override these via
         usePageTitle/useSeoMeta. Without this the document had no <title> at all, so the
         browser tab and any shared link fell back to the bare URL. -->
    <title>P91 Car Care — Professional Car Detailing in Bangalore</title>
    <meta
      name="description"
      content="Professional car detailing in Bangalore: ceramic coating, paint protection film, interior and exterior detailing, glass coating and headlight restoration. Book online in 60 seconds."
    />

    <!--
      Archivo (headings) and IBM Plex Sans (body) are the approved redesign typefaces,
      now self-hosted. The render-blocking stylesheet from fonts.googleapis.com is gone,
      and with it two extra origins (googleapis + gstatic) that each cost a DNS lookup
      and a TLS handshake in front of first paint. Faces are declared in
      client/src/styles/fonts.css.

      Both are VARIABLE fonts: one file per family covers every weight the site uses,
      which is why there are two preloads rather than seven.

      These preloads exist BECAUSE of font-display: optional. `optional` gives a font one
      short window to arrive and otherwise keeps the fallback for the whole page view —
      that is what guarantees no font-driven layout shift, but without a preload the font
      would routinely miss that window and a first-time visitor would never see it.
      Preload only what renders above the fold: adding the editorial faces here would
      make them compete with the LCP image for bandwidth.

      crossorigin is REQUIRED even though these are same-origin: fonts are always fetched
      in CORS mode, and a preload without it is fetched twice.
    -->
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Square tab icon: the P91 mark alone (the full logo's "CAR CARE" line makes it look stretched at 16-32px). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Baseline Open Graph / Twitter tags.
         useSeoMeta overwrites og:title, og:description, og:image and og:url per route; these
         are the fallback every route inherits, and the only thing a crawler sees on a route
         that does not call the hook. Without them a link pasted into WhatsApp — the channel
         this business actually runs on — rendered as a bare URL with no preview card. -->
    <meta property="og:site_name" content="P91 Car Care" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="P91 Car Care — Professional Car Detailing in Bangalore" />
    <meta
      property="og:description"
      content="Ceramic coating, paint protection film, interior and exterior detailing in Bangalore. Book online in 60 seconds."
    />
    <meta property="og:image" content="https://p91carcare.com/og/og-default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="P91 Car Care — Professional Car Detailing in Bangalore" />
    <meta
      name="twitter:description"
      content="Ceramic coating, paint protection film, interior and exterior detailing in Bangalore. Book online in 60 seconds."
    />
    <meta name="twitter:image" content="https://p91carcare.com/og/og-default.jpg" />

    <!-- Third-party tags: Google Ads (gtag.js, AW-11467752288) and Microsoft Clarity (yezkqr1rwm).

         GOOGLE ANALYTICS DESTINATIONS. The Ads tag is configured in Google (not in this file) to also report to two GA4
         streams: G-D3QRLWNCY5 ("P91 Car Care", P91's own property) and G-QXEEJ4EK4J, which is the Just Signs property
         (justsigns.co.in, GA4 property 343044602). Just Signs is the same company; P91 traffic is sent there for combined
         reporting. This is deliberate. It does NOT affect Google Search indexing or ranking. To separate the two sites in
         the Just Signs reports, filter on hostname = p91carcare.com.

         PERFORMANCE. Loaded straight from <head> they cost about 3.4 s (gtag) and 0.7 s (Clarity)
         of main-thread blocking on a mid-range phone, ahead of the app itself. They are now
         injected after the page has loaded and gone quiet (4 s after the load event) or on the
         visitor's first touch, key press or scroll, whichever comes first.

         NOTHING IS LOST IN BETWEEN. window.dataLayer, gtag() and clarity() are defined at once
         and queue their calls, so config, conversions and offer events fired before the scripts
         arrive are replayed by them when they load. The only visitors not counted are those
         who leave within about 4 s without touching the page.

         ADMIN GUARD (unchanged): Clarity is never injected when the first page load is under
         /admin. Admin screens show real customer names, phone numbers and bookings, and none
         of that belongs in a session recording. src/lib/clarity.ts handles navigation INTO
         /admin after the app has booted.

         Traffic is only separable by campaign if ad destination URLs carry utm_* parameters:
         Instagram and Facebook in-app browsers strip the referrer. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-11467752288');

      (function () {
        var isAdmin = location.pathname.indexOf('/admin') === 0;
        // Clarity's official queueing stub, so clarity(...) calls made before the tag loads are kept.
        if (!isAdmin) {
          (function (c, a) { c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); }; })(window, 'clarity');
        }
        var loaded = false;
        function add(src) {
          var t = document.createElement('script');
          t.async = true;
          t.src = src;
          document.head.appendChild(t);
        }
        function loadTags() {
          if (loaded) return;
          loaded = true;
          ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
            window.removeEventListener(e, loadTags, true);
          });
          add('https://www.googletagmanager.com/gtag/js?id=AW-11467752288');
          if (!isAdmin) add('https://www.clarity.ms/tag/yezkqr1rwm');
        }
        ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
          window.addEventListener(e, loadTags, { capture: true, passive: true, once: true });
        });
        function afterLoad() { setTimeout(loadTags, 4000); }
        if (document.readyState === 'complete') afterLoad();
        else window.addEventListener('load', afterLoad);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The Replit dev-banner script was removed. It is a development-only helper, the
         app no longer runs on Replit, and it made a third-party request to replit.com on
         every production page load (blocked by ORB, so it only ever cost a round trip). -->
  </body>
</html>
