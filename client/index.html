<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Default document title and description. Routes override these via
         usePageTitle/useSeoMeta. Without this the document had no <title> at all, so the
         browser tab and any shared link fell back to the bare URL. -->
    <title>P91 Car Care — Professional Car Detailing in Bangalore</title>
    <meta
      name="description"
      content="Professional car detailing in Bangalore: ceramic coating, paint protection film, interior and exterior detailing, glass coating and headlight restoration. Book online in 60 seconds."
    />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-11467752288"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-11467752288');
    </script>

    <!-- Microsoft Clarity — session counts, heatmaps and recordings.
         The site had no analytics of any kind: no GA4, no Meta Pixel, no GTM. The Google
         Ads tag above is a conversion/remarketing tag and reports no traffic, so there was
         no way to answer how many people reached the site or where they came from.

         One tag here covers every route: this is a single-page app and Clarity tracks
         client-side navigation itself. Traffic is only separable by campaign if the ad
         destination URLs carry utm_* parameters — Instagram and Facebook in-app browsers
         routinely strip the referrer, so paid social otherwise lands in Clarity as
         "Direct". -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yezkqr1rwm");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The Replit dev-banner script was removed. It is a development-only helper, the
         app no longer runs on Replit, and it made a third-party request to replit.com on
         every production page load (blocked by ORB, so it only ever cost a round trip). -->
  </body>
</html>
