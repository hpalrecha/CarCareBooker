# p91carcare.com routing after the Plan 3 cutover.
#
# Replaces the single `location / { ... proxy_pass http://127.0.0.1:8084; }` inside the apex
# `server { listen 443 ... server_name p91carcare.com; }` block. Installed as
#   /etc/nginx/snippets/p91carcare.locations.conf
# and pulled in with `include snippets/p91carcare.locations.conf;` where that location was
# (docs/superpowers/plans/plan-3-cutover-runbook.md, step 4).
#
#   8084  API container (carcarebooker): API, admin, uploads, images, the old online booking pages
#         (/service/*, /booking-confirmation/*) and every static file the old app shell loads.
#   8085  web container (carcarebooker-web): everything else, including /, /services/*, /areas/*,
#         /brands/*, /guides/*, /_next/*, /sitemap.xml, /robots.txt, /llms.txt and the old URLs it 308s.
#
# Static files: the old app shell (dist/public/app.html, served for /service/*) loads /assets/*,
# /fonts/*, /favicon*.png|ico, /apple-touch-icon.png and /site.webmanifest. Those stay on 8084, and
# the new site uses the SAME favicon files (apps/web/app/layout.tsx declares /favicon.ico and
# /apple-touch-icon.png), so there is one owner for each: the API container. /og/* (share images),
# the Bing verification file and the IndexNow key file also stay on 8084.
#
# Matching: `=` exact and `^~` prefix locations win over regex locations and stop the search, so a
# request below is never handed to the web container by accident. Everything else falls to `/`.
#
# PROXY SETTINGS. The headers below are the standard set. Before installing, compare with the
# existing `location /` block in the vhost (runbook step 3): any extra directive it has (timeouts,
# client_max_body_size for admin uploads, proxy_buffering, websocket Upgrade headers) must be added
# to EVERY 8084 location here, or that behaviour changes for the API.

# ---------------------------------------------------------------- API container (8084)
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /attached_assets/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Old online booking pages (noindex, canonical to the new service page) until Plan 2c.
location ^~ /service/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /booking-confirmation/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static files of the old app shell (vite build output, dist/public top level).
location ^~ /assets/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /fonts/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /og/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Single files from apps/admin/public: favicons and manifest (shared by both sites), Bing site
# verification, the IndexNow key (scripts/auto-deploy.sh pings with it) and the old logo file.
# (Quoted because one name has spaces; nginx matches the decoded URI, so %20 in a request matches.)
location ~ "^/(favicon\.ico|favicon-64\.png|favicon-512\.png|apple-touch-icon\.png|site\.webmanifest|BingSiteAuth\.xml|73e676a76120792878e9f414cf8dc6b9\.txt|Car Care \(4\)_1753951564515\.png)$" {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------------------------------------------------------- web container (8085)
location / {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
